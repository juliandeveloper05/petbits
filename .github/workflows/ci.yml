name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo del lockfile y falla
      # si package.json y package-lock.json no coinciden, en vez de arreglarlo
      # en silencio.
      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint y formato
        run: npx biome check src test scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build
