name: Desplegar a GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permisos mínimos para publicar en Pages con OIDC, sin tokens de larga vida.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No se cancela el que está en curso: cortar a mitad de
# una publicación puede dejar el sitio a medio actualizar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Verificar y construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Se verifica antes de publicar: nada llega al sitio sin pasar los tests.
      - name: Tipos
        run: npm run typecheck

      - name: Lint y formato
        run: npx biome check src test scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
