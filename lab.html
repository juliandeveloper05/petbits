<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetBits · Laboratorio genético</title>
    <meta
      name="description"
      content="Generador procedural de criaturas: cada una nace de una semilla de 64 bits."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/lab/lab.css" />
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>

    <header class="lab-header">
      <div class="brand">
        <h1>PetBits</h1>
        <span class="brand-sub">Laboratorio genético</span>
        <a class="volver" href="./index.html">← Volver al juego</a>
      </div>

      <form class="seed-form" id="seed-form">
        <label class="seed-label" for="seed-input">Semilla</label>
        <input
          id="seed-input"
          class="seed-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="A3F0-91C4-77BE-2D08 o cualquier texto"
        />
        <button class="btn" type="submit">Generar</button>
        <button class="btn btn-ghost" type="button" id="random-btn">Aleatoria</button>
      </form>
    </header>

    <main>
      <section class="detail" id="detail" aria-live="polite"></section>

      <section class="grid-section">
        <div class="grid-header">
          <h2>Población generada</h2>
          <button class="btn btn-ghost" type="button" id="reroll-btn">Regenerar 60</button>
        </div>
        <div class="grid" id="grid"></div>
      </section>
    </main>

    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
