<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PetBits</title>
    <meta
      name="description"
      content="Criaturas de datos: cada una nace de una semilla de 64 bits. Vive en tiempo real, aunque cierres la pestaña."
    />
    <meta name="theme-color" content="#0a0e0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/game.css" />
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>

    <main class="console">
      <div class="console-top">
        <span class="brand">PetBits</span>
        <button id="mute-btn" class="icon-btn" type="button" aria-pressed="false">
          <span aria-hidden="true">♪</span>
          <span class="sr-only">Silenciar</span>
        </button>
      </div>

      <div class="screen">
        <!-- ---------------------------------------------------- nacimiento -->
        <section id="screen-nacer" class="panel" hidden>
          <h1 class="title">PetBits</h1>
          <p class="tagline">
            Cada criatura nace de una semilla de 64&nbsp;bits. Ese número es su cuerpo, su color y su
            carácter.
          </p>

          <div class="hatch-preview">
            <canvas id="hatch-canvas" width="192" height="192" aria-hidden="true"></canvas>
            <p id="hatch-info" class="hatch-info"></p>
          </div>

          <form id="hatch-form" class="hatch-form">
            <label class="field-label" for="hatch-seed">Semilla</label>
            <input
              id="hatch-seed"
              class="field"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="tu nombre, o dejalo al azar"
            />
            <div class="hatch-actions">
              <button class="btn btn-ghost" type="button" id="hatch-random">Otra</button>
              <button class="btn" type="submit">Adoptarla</button>
            </div>
          </form>
        </section>

        <!-- ------------------------------------------------------- cuidado -->
        <section id="screen-cuidado" class="panel" hidden>
          <header class="pet-header">
            <div>
              <span id="pet-lineage" class="pet-lineage"></span>
              <span id="pet-form" class="pet-form"></span>
            </div>
            <span id="pet-stage" class="badge"></span>
          </header>

          <div class="stage-area">
            <div id="pet-sprite" class="pet-sprite">
              <canvas id="pet-canvas" width="192" height="192"></canvas>
            </div>
            <span id="pet-reaction" class="reaction" aria-hidden="true"></span>
            <span id="pet-mood" class="pet-mood"></span>
          </div>

          <dl class="stats" id="stats"></dl>
        </section>

        <!-- ------------------------------------------------------ criadero -->
        <section id="screen-criadero" class="panel" hidden>
          <header class="panel-header">
            <h2 class="panel-title">Criadero</h2>
            <button class="btn btn-ghost btn-sm" type="button" id="criadero-cerrar">Volver</button>
          </header>

          <p id="codex-progreso" class="codex-progreso"></p>

          <div id="criadero-lista" class="criadero-lista"></div>

          <div class="criadero-cruza">
            <button class="btn" type="button" id="cruzar-btn" disabled>Cruzar</button>
            <p id="cruzar-motivo" class="criadero-motivo"></p>
          </div>

          <form id="nueva-form" class="nueva-form">
            <label class="field-label" for="nueva-seed">Incubar otra semilla</label>
            <div class="nueva-fila">
              <input
                id="nueva-seed"
                class="field"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="pegá una semilla o un texto"
              />
              <button class="btn btn-ghost" type="submit">Incubar</button>
            </div>
          </form>
        </section>
      </div>

      <div class="controls">
        <button class="btn" type="button" data-action="alimentar">Alimentar</button>
        <button class="btn" type="button" data-action="jugar">Jugar</button>
        <button class="btn" type="button" data-action="mimo">Mimo</button>
      </div>

      <footer class="console-foot">
        <span id="seed-label" class="seed-label"></span>
        <button class="lab-link" type="button" id="criadero-btn">Criadero</button>
        <a class="lab-link" href="./lab.html">Laboratorio →</a>
      </footer>
    </main>

    <!-- ------------------------------------------------------------ modales -->
    <div id="food-modal" class="modal" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="food-title">
        <h2 id="food-title" class="modal-title">¿Qué le damos?</h2>
        <div id="food-grid" class="food-grid"></div>
        <button class="btn btn-ghost" type="button" data-close-modal>Mejor no</button>
      </div>
    </div>

    <div id="digest-modal" class="modal" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="digest-title">
        <h2 id="digest-title" class="modal-title">Mientras no estabas</h2>
        <p id="digest-headline" class="digest-headline"></p>
        <ul id="digest-list" class="digest-list"></ul>
        <button class="btn" type="button" data-close-modal>Ya volví</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
